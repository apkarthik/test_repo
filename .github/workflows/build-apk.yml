name: Build Optimized APK

on:
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Optimized Release APK
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build release APK with optimizations
        run: |
          # Build release APK with code shrinking and resource optimization
          flutter build apk --release --split-per-abi
      
      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: |
            build/app/outputs/flutter-apk/*.sha1
            build/app/outputs/flutter-apk/*.json
          if-no-files-found: ignore
          retention-days: 7
